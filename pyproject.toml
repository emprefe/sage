[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-provenance"
version = "0.1.0"
description = "Experimental SAGE provenance reference implementation"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sage = "sage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
